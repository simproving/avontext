<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procesare Text</title>
<style>
    .container {
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .row {
        display: flex;
        flex-direction: row;
        justify-content: center;
        margin-bottom: 10px;
    }
    textarea {
        width: 550px;
        height: 750px;
        margin: 5px;
        padding: 5px;
        border: 1px solid #ccc;
        resize: none;
        font-size: 11px;
    }
    button {
        margin-bottom: 10px;
        padding: 10px 20px;
        font-size: 16px;
        background-color: #007bff;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    #result {
        margin-top: 20px;
    }
</style>
</head>
<body>

<div class="container">
    <button id="processButton">Procesare Text</button>
    <button onclick="printTextarea2()">Printare text casuta 2</button>
    <div class="row">
        <textarea id="textarea1" placeholder="Text Area 1"></textarea>
        <textarea id="textarea2" placeholder="Text Area 2"></textarea>
    </div>

</div>

<script>
    function printTextarea2() {
        var printContents = document.getElementById("textarea2").value;
        var split_text = printContents.split("\n");
        var textToBePrinted = ""
        for (let i = 0; i < split_text.length; i++) {
            textToBePrinted += split_text[i] + "<br>";
        }
        var w = window.open(' ', ' ');
        w.document.write('<style>body{font:10px/1.25 monospace;margin:10mm;}</style>' + textToBePrinted);
        w.print();
        w.close();
    }

    var RE_REDUS = /^pret redus:?\s*([\d.,]+)/;
    var RE_NORMAL = /^pret normal:?\s*([\d.,]+)/;
    var RE_PROCENT = /^reducere:\s*(\d+)\s*%/;
    var RE_SKU = /^sku:\s*(\d+)/;
    var RE_MONEY = /^([\d.,]+)\s*(?:lei|ron)$/;
    var RE_PER_UNIT = /^\((.+)\)$/;
    var RE_POINTS = /^(\d+)\s*ap$/;
    var RE_QTY = /^(\d+)$/;
    var RE_PROMO = /\(-?[\d.,]+\s*lei\)$/;

    var PRODUCT_LABELS = ['pret redus', 'pret normal', 'pret recomandat',
        'valoare reducere', 'reducere', 'sku', 'cod de reducere',
        'scade cantitatea', 'creste cantitatea', 'elimina', 'aplica', 'total'];

    // True for anything that is not a name: labels, amounts, quantity, points,
    // per-unit prices, promo captions ("Senses BB 1L -50% (-12,37 lei)") and the
    // promo-code block at the end of the basket.
    function isFieldLine(line) {
        var n = norm(line);
        if (n === '' || RE_QTY.test(n) || RE_MONEY.test(n)) return true;
        if (RE_PER_UNIT.test(n) || RE_POINTS.test(n) || RE_PROMO.test(n)) return true;
        return PRODUCT_LABELS.some(function (label) { return startsWith(line, label); });
    }

    // ---- Coș (basket) parser -------------------------------------------------
    var DIACRITIC_MAP = {
        '\u0218': 's', '\u0219': 's', '\u021a': 't', '\u021b': 't',
        '\u0102': 'a', '\u0103': 'a', '\u00c2': 'a', '\u00c3': 'a',
        '\u00ce': 'i', '\u00cf': 'i', '\u00d2': 'o', '\u00d3': 'o'
    };

    // Normalizes a raw line so labels can be matched regardless of diacritics
    // (ț/ş/ă/î/â) or casing coming from the site.
    function norm(value) {
        return String(value)
            .replace(/[\u0218\u0219\u021a\u021b\u0102\u0103\u00c2\u00c3\u00ce\u00cf\u00d2\u00d3]/g,
                function (c) { return DIACRITIC_MAP[c]; })
            .toLowerCase()
            .replace(/\u00a0/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();
    }

    function startsWith(line, prefix) { return norm(line).indexOf(prefix) === 0; }

    // Rows after the duplicated product title ("Ulei de buze hrănitor" twice) are
    // identical most of the time; collapse them so the name prints once.
    function dedupeConsecutive(rows) {
        var out = [];
        rows.forEach(function (row) {
            if (out.length === 0 || norm(out[out.length - 1]) !== norm(row)) out.push(row);
        });
        return out;
    }

    function toNumber(value) {
        var n = parseFloat(String(value).replace(/\./g, '').replace(',', '.'));
        return isNaN(n) ? 0 : n;
    }

    // Extracts the value captured by `re` from `line`, or "" when absent.
    function capture(re, line) {
        var m = re.exec(norm(line));
        return m ? m[1] : "";
    }

    function indexOfRow(rows, predicate) {
        for (var i = 0; i < rows.length; i++) {
            if (predicate(norm(rows[i]), i)) return i;
        }
        return -1;
    }

    function parseProduct(block) {
        var rows = block.map(function (line) { return line.trim(); });
        if (indexOfRow(rows, function (n) { return n.indexOf('pret redus') === 0; }) < 0) return null;

        // The site prints the product title twice and drops further name-like lines
        // (size, scent, ...) in random places inside the block, so the name is
        // every non-field line of the block.
        var title = [];
        for (var i = 0; i < rows.length; i++) {
            if (!isFieldLine(rows[i])) title.push(rows[i]);
        }

        var iRedus = indexOfRow(rows, function (n) { return n.indexOf('pret redus') === 0; });
        var iNormal = indexOfRow(rows, function (n) { return n.indexOf('pret normal') === 0; });
        var iSku = indexOfRow(rows, function (n) { return RE_SKU.test(n); });
        var iProcent = indexOfRow(rows, function (n) { return RE_PROCENT.test(n); });
        var iScade = indexOfRow(rows, function (n) { return n === 'scade cantitatea'; });
        var iElimina = indexOfRow(rows, function (n) { return n === 'elimina'; });

        return {
            name: dedupeConsecutive(title).join(' '),
            sku: iSku >= 0 ? RE_SKU.exec(norm(rows[iSku]))[1] : '',
            redus: capture(RE_REDUS, rows[iRedus]),
            normal: iNormal >= 0 ? capture(RE_NORMAL, rows[iNormal]) : '',
            procent: iProcent >= 0 ? RE_PROCENT.exec(norm(rows[iProcent]))[1] : '',
            qty: iScade >= 0 ? capture(RE_QTY, rows[iScade + 1] || '') : '',
            total: iElimina >= 0 ? capture(RE_MONEY, rows[iElimina + 1] || '') : ''
        };
    }

    // Splits the basket into one block per product. Blocks start at the product
    // title and end with "Elimină" + line total; the site is inconsistent about
    // leaving blank lines between them, so titles are found by walking backwards
    // from "Preț redus" - never past the previous block's line total, otherwise
    // a name printed right after a block would be stolen by the next product.
    function parseBasket(text) {
        var lines = String(text).replace(/\r\n?/g, '\n').split('\n');
        var total = "";
        var separator = "--------------------------------------------\n";

        // The trailing "Total: 401,69 RON" line is not part of any product.
        for (var t = lines.length - 1; t >= 0; t--) {
            var m = /^total:\s*(.+)$/i.exec(lines[t].trim());
            if (m) { total = m[1].trim(); lines.splice(t, 1); break; }
        }

        // Drop the "Coș / Produs Cantitate Total" table header.
        var headerEnd = 0;
        while (headerEnd < lines.length) {
            var h = norm(lines[headerEnd]);
            var isHeader = h === 'cos' || h === 'cosul' ||
                (h.indexOf('cantitate') >= 0 && h.indexOf('total') >= 0);
            if (h === '' || isHeader) headerEnd++; else break;
        }

        var blocks = [];
        var start = headerEnd;
        var floor = headerEnd;
        var afterElimina = false;
        for (var i = headerEnd; i < lines.length; i++) {
            var n = norm(lines[i]);
            if (startsWith(lines[i], 'pret redus')) {
                var nameStart = i;
                while (nameStart > floor && !isFieldLine(lines[nameStart - 1])) nameStart--;
                if (nameStart > start) blocks.push(lines.slice(start, nameStart));
                start = nameStart;
                afterElimina = false;
            } else if (n === 'elimina') {
                afterElimina = true;
            } else if (afterElimina && RE_MONEY.test(n)) {
                floor = i + 1;
                afterElimina = false;
            }
        }
        if (lines.slice(start).some(function (line) { return norm(line) !== ''; })) {
            blocks.push(lines.slice(start));
        }

        var products = blocks.map(parseProduct).filter(function (p) { return p !== null; });
        products.forEach(function (p) { if (p.qty === '') p.qty = '1'; });

        if (total === '') {
            var sum = products.reduce(function (acc, p) { return acc + toNumber(p.total); }, 0);
            total = sum.toFixed(2).replace('.', ',') + ' RON';
        }

        var textOutput = "";
        products.forEach(function (p) {
            var head = [];
            if (p.sku !== '') head.push(p.sku);
            if (p.name !== '') head.push(p.name);

            var details = ['CANT. ' + p.qty, p.total + ' Lei'];
            if (p.redus !== '') details.push('Pret unitar - ' + p.redus + ' Lei');
            if (p.normal !== '') details.push(p.normal + ' Lei');
            if (p.procent !== '') details.push(p.procent + '%');

            if (head.length > 0) textOutput += head.join(' | ') + "\n";
            textOutput += details.join(' | ') + "\n" + separator;
        });

        textOutput += "Total de plata: " + total;

        return { products: products, total: total, text: textOutput };
    }

    // Get references to the elements
    const textarea1 = document.getElementById('textarea1');
    const textarea2 = document.getElementById('textarea2');
    const processButton = document.getElementById('processButton');

    // Add click event listener to the button
    processButton.addEventListener('click', function() {
        // Get the text from the first textarea
        var text = textarea1.value;
        var result = parseBasket(text);
        textarea2.value = result.products.length ? result.text : "";
        console.log(result.products);
    });
</script>

<!-- Home button will be added by the homeButton.js script -->
<script src="https://cdn.jsdelivr.net/gh/simproving/utils@latest/homeButton.js"></script>

</body>
</html>
